# Усі значення кольорів задаються в BGR (формат OpenCV).
slides:
  directory: slides
  pattern: "*.png"
  scale: 1.25

camera:
  index: 0
  preview_width: 560
  mirror: true
  median_blur_kernel: 3

vision:
  max_num_hands: 1
  detection_confidence: 0.6
  tracking_confidence: 0.5
  thumb_tip: 4
  thumb_base: 5
  thumb_reference_start: 0
  thumb_reference_end: 9
  thumb_open_ratio: 0.7
  finger_tips: [8, 12, 16, 20]
  finger_joint_offset: 2
  wrist_index: 0

pointer:
  landmark_index: 8
  crop_offset: 0.2
  crop_width: 0.6
  smoothing: 0.5

gestures:
  hold_seconds: 1.0
  debounce_seconds: 0.2
  patterns:
    start: [1, 1, 1, 1, 1]
    next: [0, 1, 0, 0, 0]
    prev: [1, 0, 0, 0, 0]
    draw: [0, 1, 1, 0, 0]
    color: [1, 1, 1, 0, 0]
    erase: [0, 1, 1, 1, 0]

drawing:
  colors:
    - [50, 50, 240]
    - [80, 190, 60]
    - [240, 120, 40]
  brush_size: 5
  eraser_radius: 26
  eraser_stroke_multiplier: 2
  erased_color: [0, 0, 0]
  cursor_radius_extra: 3
  cursor_line_width: 2

display:
  stage_title: Presentation
  camera_title: camera
  stage_x: 20
  stage_y: 60
  camera_gap_x: 40
  camera_y: 60
  background_value: 24
  wait_key_ms: 1
  exit_key_codes: [27, 113]  # Escape або q

  skeleton_color: [255, 255, 255]
  skeleton_thickness: 3
  landmark_outer_radius: 6
  landmark_inner_radius: 4
  landmark_inner_color: [40, 40, 235]
  status_radius: 20
  status_border_thickness: 1
  status_progress_thickness: 4
  palette_x: 28
  palette_spacing: 40
  palette_bottom_margin: 26
  palette_active_radius: 15
  palette_inactive_radius: 8
  palette_inner_active_radius: 13
  palette_inner_inactive_radius: 6
